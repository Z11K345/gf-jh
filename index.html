<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>号码清单</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
background:#f5f6f8;color:#1a1a1a;padding:16px}
.wrap{max-width:720px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:13px;color:#888;margin-bottom:14px}
label{font-size:13px;color:#666;display:block;margin-bottom:6px}
input{width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:8px;outline:none}
input:focus{border-color:#d97706}
button{width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:600;color:#fff;
background:#d97706;border:0;border-radius:8px}
button:active{opacity:.85}
.err{color:#c0392b;font-size:13px;margin-top:10px;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid #eee;vertical-align:top}
th{color:#888;font-weight:500;font-size:12px}
td.ph{font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#fef3c7;color:#92400e;margin-left:4px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;margin:0;background:#fff;color:#555;border:1px solid #e5e7eb;font-weight:500}
.tabs button.on{background:#d97706;color:#fff;border-color:#d97706}
.n{font-size:12px;color:#888;margin-bottom:8px}
.hide{display:none}
</style></head><body><div class="wrap">

<div class="card" id="lockCard">
  <h1>号码清单</h1>
  <div class="sub">数据已加密，请输入口令查看</div>
  <label>口令</label>
  <input id="pwd" type="password" inputmode="text" autocomplete="current-password" placeholder="请输入口令">
  <button id="go">解 锁</button>
  <div class="err" id="err"></div>
</div>

<div id="main" class="hide">
  <div class="card">
    <h1>号码清单</h1>
    <div class="sub" id="meta"></div>
    <div class="tabs">
      <button id="t1" class="on">新号码 <span id="c1"></span></button>
      <button id="t2">重复号码 <span id="c2"></span></button>
    </div>
    <div id="tb1"></div>
    <div id="tb2" class="hide"></div>
  </div>
</div>

<script>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function go(){
  var pwd=document.getElementById('pwd').value;
  var err=document.getElementById('err'); err.textContent='解密中…';
  crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveBits'])
  .then(function(k){return crypto.subtle.deriveBits(
      {name:'PBKDF2',salt:b64(PACK.salt),iterations:PACK.iter,hash:'SHA-256'},k,256);})
  .then(function(bits){return crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);})
  .then(function(key){return crypto.subtle.decrypt(
      {name:'AES-GCM',iv:b64(PACK.iv)},key,b64(PACK.ct));})
  .then(function(pt){render(JSON.parse(new TextDecoder().decode(pt)));})
  .catch(function(e){err.textContent='口令不对，或数据已损坏';});
}
document.getElementById('go').onclick=go;
document.getElementById('pwd').addEventListener('keydown',function(e){if(e.key==='Enter')go();});

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function tbl(rows){
  var h='<table><thead><tr><th>手机号码</th><th>时间</th><th>用户页面</th><th>员工</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td class="ph">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+
       '</td><td>'+(r.length>4 ? esc(r[3])+' '+esc(r[4]) : esc(r[3]))+'</td></tr>';
  });
  return h+'</tbody></table>';
}
function render(d){
  document.getElementById('lockCard').classList.add('hide');
  document.getElementById('main').classList.remove('hide');
  document.getElementById('meta').textContent='更新于 '+d.updated+' ｜ 共 '+(d.ws1.length+d.ws2.length)+' 条';
  document.getElementById('c1').textContent='('+d.ws1.length+')';
  document.getElementById('c2').textContent='('+d.ws2.length+')';
  document.getElementById('tb1').innerHTML=tbl(d.ws1);
  // 重复号码表不标「已在总表」：能进重复表本身就是总表命中筛出来的，再标是废话（曾科 10/22）
  document.getElementById('tb2').innerHTML=tbl(d.ws2);
  document.getElementById('t1').onclick=function(){show(1);};
  document.getElementById('t2').onclick=function(){show(2);};
}
function show(i){
  document.getElementById('tb1').classList.toggle('hide',i!==1);
  document.getElementById('tb2').classList.toggle('hide',i!==2);
  document.getElementById('t1').classList.toggle('on',i===1);
  document.getElementById('t2').classList.toggle('on',i===2);
}
</script>
